name: iOS UI Test Daily
run-name: ${{ github.actor }} is running XCUITests

on:
  schedule:
    - cron: '0 0 * * 1-5' # 07:00 AM Vietnam Time (UTC+7), Mon–Fri
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Runner type'
        required: true
        default: 'macos-latest'
      useUrlTestData:
        description: Enable download testdata from url
        type: boolean
        required: false
        default: false
      list_tests:
        description: Input subset of tests
        required: false
        default: ''
      ios-version:
        description: 'iOS Version'
        required: false
        default: '18.2'
      simulator-name:
        description: 'Simulator Name'
        required: false
        default: 'iPhone 16'
      xcode-version:
        description: 'Xcode Version'
        required: false
        default: '16.2'
      testing-branch:
        description: 'Testing branch'
        required: false
        default: 'master'

env:
  PATH_TEST_SUITE: record360UITests/Resources/testRun.json

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    name: Test UI on iOS Simulator
    runs-on: ${{ github.event.inputs.runner_type || 'macos-latest' }}

    steps:
      # -------------------- CHECKOUT --------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WDIO_ACCESS_TOKEN }}
          repository: ${{ secrets.WDIO_IOS_REPOS }}
          ref: ${{ github.event.inputs.testing-branch || 'master' }}

      - name: Setup SSH
        uses: tanmancan/action-setup-ssh-agent-key@1.0.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
          ssh-public-key: ${{ secrets.PUBLIC_KEY_CHECKOUT }}

      # -------------------- TEST DATA --------------------
      - name: Download test data from Firebase
        if: ${{ inputs.useUrlTestData == true }}
        run: |
          echo "${{ secrets.FIREBASE_SDK_KEY }}" > record360UITests/Firebase/firebase-sdk-key.json
          cd record360UITests/Firebase
          npm install
          node firebase.js

      # -------------------- XCODE & SIMULATOR --------------------
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '16.2' }}

      - name: Set Simulator Name
        run: echo "SIMULATOR_NAME=${{ inputs.simulator-name || 'iPhone 16' }}" >> $GITHUB_ENV

      - name: Boot Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ inputs.simulator-name || 'iPhone 16' }}
          os: iOS
          os_version: ${{ inputs.ios-version || '18.2' }}

      # -------------------- DEPENDENCIES --------------------
      - name: Install CocoaPods
        run: |
          pod install --repo-update
          pod update Record360SDK

      - name: Copy Configuration
        run: sh ci_scripts/ci_configuration.sh

      - name: Install xcpretty
        run: |
          echo "source 'https://rubygems.org'" > Gemfile
          echo "gem 'xcpretty', git: 'https://github.com/xcpretty/xcpretty.git'" >> Gemfile
          bundle install
          bundle exec xcpretty --version

      # -------------------- RUN TESTS --------------------
      - name: Execute Full Test Suite
        if: ${{ inputs.list_tests == '' }}
        run: |
          chmod +x ./ci_scripts/run-testsuite.sh
          ./ci_scripts/run-testsuite.sh \
            --testBundle=record360UITests \
            --path="$PATH_TEST_SUITE" \
            --deviceName="$SIMULATOR_NAME"

      - name: Execute Custom Tests
        if: ${{ inputs.list_tests != '' }}
        run: |
          chmod +x ./ci_scripts/run-tests.sh
          ./ci_scripts/run-tests.sh \
            --testBundle=record360UITests \
            --list-tests="${{ inputs.list_tests }}" \
            --deviceName="$SIMULATOR_NAME"

      # -------------------- PARSE XCRESULT --------------------
      - name: Parse xcresult
        id: xcresult
        if: success() || failure()
        run: |
          RESULT_PATH="TestResult.xcresult"

          if [ ! -d "$RESULT_PATH" ]; then
            echo "❌ TestResult.xcresult not found"
            exit 1
          fi

          # `xcresulttool get` (default "object" subcommand, used previously here) is
          # deprecated on Xcode 16+, and its testsCount/failureCount/skippedCount
          # fields are duplicated per repetition — with run-testsuite.sh's
          # -retry-tests-on-failure/-test-iterations, a test that fails once then
          # passes on retry got counted as two separate test runs (one fail, one
          # pass) instead of one final pass.
          #
          # The current "test-results summary" API instead reports each test's
          # FINAL result only — a test retried once and passing the second time is
          # counted once as passed, matching what Xcode's own Test Report shows.
          SUMMARY_JSON=$(xcrun xcresulttool get test-results summary --path "$RESULT_PATH" --compact 2>&1)
          TOTAL=$(echo "$SUMMARY_JSON" | jq '.totalTestCount' 2>/dev/null)

          if [ -z "$TOTAL" ] || [ "$TOTAL" = "null" ] || [ "$TOTAL" = "0" ]; then
            echo "❌ xcresult has no recorded tests"
            echo "$SUMMARY_JSON"
            exit 1
          fi

          PASSED=$(echo "$SUMMARY_JSON" | jq '.passedTests  // 0')
          FAILED=$(echo "$SUMMARY_JSON" | jq '.failedTests  // 0')
          SKIPPED=$(echo "$SUMMARY_JSON" | jq '.skippedTests // 0')

          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          echo "Reporting counts → Passed=$PASSED Failed=$FAILED Skipped=$SKIPPED Total=$TOTAL"

      # -------------------- UPLOAD ARTIFACT --------------------
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResult.xcresult
          retention-days: 7

      # -------------------- GOOGLE CHAT CARD --------------------
      - name: Notify Google Chat
        if: always() 
        run: |
          STATUS="${{ job.status }}"

          if [ "$STATUS" = "success" ]; then
            STATUS_TEXT="SUCCESS"
            COLOR="#188038"
            ICON="https://fonts.gstatic.com/s/i/materialicons/check_circle/v6/24px.svg"
          else
            STATUS_TEXT="FAILED"
            COLOR="#D93025"
            ICON="https://fonts.gstatic.com/s/i/materialicons/error/v6/24px.svg"
          fi

          curl -X POST -H "Content-Type: application/json" \
          -d "{
            \"cardsV2\": [{
              \"card\": {
                \"header\": {
                  \"title\": \"📱 iOS UI Test\",
                  \"subtitle\": \"${STATUS_TEXT}\",
                  \"imageUrl\": \"${ICON}\",
                  \"imageType\": \"CIRCLE\"
                },
                \"sections\": [{
                  \"widgets\": [
                    { \"decoratedText\": { \"text\": \"<b>Status:</b> <font color='${COLOR}'>${STATUS_TEXT}</font>\" }},
                    { \"decoratedText\": { \"text\": \"✅ <b>Passed:</b> ${{ steps.xcresult.outputs.passed }}\" }},
                    { \"decoratedText\": { \"text\": \"❌ <b>Failed:</b> ${{ steps.xcresult.outputs.failed }}\" }},
                    { \"decoratedText\": { \"text\": \"⏭️ <b>Skipped:</b> ${{ steps.xcresult.outputs.skipped }}\" }},
                    { \"decoratedText\": { \"text\": \"🌿 <b>Branch:</b> ${{ github.event.inputs.testing-branch || 'master' }}\" }},
                    {
                      \"buttonList\": {
                        \"buttons\": [{
                          \"text\": \"Open GitHub Action\",
                          \"onClick\": {
                            \"openLink\": {
                              \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                            }
                          }
                        }]
                      }
                    }
                  ]
                }]
              }
            }]
          }" \
          ${{ secrets.GCHAT_WEBHOOK }}
