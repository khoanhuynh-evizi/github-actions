name: iOS UI Test
run-name: ${{ github.actor }} is XCUITests
on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Input name of runner'
        required: true
        default: 'macos-latest'
        type: string
      useUrlTestData:
        description: Enable download testdata from url
        type: boolean
        required: false
      list_tests:
        description: Input subset of tests for testing
        required: false
      ios-version:
        description: 'iOS Version (e.g., 18.2)'
        required: false
        default: '26.2'
        type: string
      simulator-name:
        description: 'Simulator Name'
        required: false
        default: 'iPhone 17'
        type: string
      xcode-version:
        description: 'Xcode version'
        required: false
        default: '26.2'
        type: string
      testing-branch:
        description: 'testing branch(e.g., master)'
        required: false
        type: string

env:
  PATH_TEST_SUITE: record360UITests/Resources/testRun.json
  TEST_BUNDLE: record360UITests
  XCRESULTS_VERSION: '1.13.1'
  IOS_FIREBASE_PROJECT_ID: ${{ secrets.IOS_FIREBASE_PROJECT_ID }}
  # XCUITest runtime noise (accessibility hierarchy dumps, element subtrees, etc.)
  TEST_LOG_NOISE_FILTER: '^[[:space:]]*(t = |▸ |Attributes:|Element (debug description|subtree):|Path to element:|Query chain:|Output:|→|↳|↪︎)'
  # Xcode 26+ build-system noise. The new explicit-modules build + expanded
  # dependency-graph output floods the log and xcbeautify does not collapse it.
  # This is applied on top of TEST_LOG_NOISE_FILTER (see the Execute steps).
  BUILD_LOG_NOISE_FILTER: '^[[:space:]]*(➜|WriteAuxiliaryFile|ExecuteExternalTool|CreateBuildDirectory|RegisterExecutionPolicyException|Copy /|CpHeader|CpResource|cd /|builtin-|/bin/mkdir|write-file|-target (arm64|x86_64)|common-args\.resp|Target dependency graph|ClangStatCache|SwiftDriverJobDiscovery|SwiftExplicitDependency|Building targets in dependency order|Preparing|GatherProvisioningInputs)'

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    name: Test UI on Simulator
    runs-on: ${{ github.event.inputs.runner_type || 'macos-latest' }}
    steps:
      # -------------------- CHECKOUT --------------------
      # Workflow repo (this repo) at the workspace root — needed so the
      # Google Chat card template under .github/googleChat/ is available.
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Checkout iOS app repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.WDIO_ACCESS_TOKEN }}
          repository: ${{ secrets.WDIO_IOS_REPOS }}
          ref: ${{ github.event.inputs.testing-branch || 'master' }}
          path: ios-app

      - name: Set up SSH Agent and Key
        uses: tanmancan/action-setup-ssh-agent-key@1.0.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
          ssh-public-key: ${{ secrets.PUBLIC_KEY_CHECKOUT }}

      # -------------------- TEST DATA --------------------
      - name: Download Test data from firebase
        if: "${{ inputs.useUrlTestData == true }}"
        working-directory: ios-app
        run: |
          echo "${{ secrets.FIREBASE_SDK_KEY }}" > record360UITests/Firebase/firebase-sdk-key.json
          cd record360UITests/Firebase
          npm install
          node firebase.js

      # -------------------- XCODE & SIMULATOR --------------------
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '26.2' }}

      - name: Set environment metadata
        run: |
          # trim whitespace defensively — xcodebuild's "-destination name=..." match is an
          # exact string compare, and a stray leading/trailing space (easy to introduce via
          # workflow_dispatch input) makes it fail to match a device that's clearly listed.
          echo "SIMULATOR_NAME=$(echo '${{ inputs.simulator-name || 'iPhone 16' }}' | xargs)" >> $GITHUB_ENV
          echo "IOS_VERSION=$(echo '${{ inputs.ios-version || '26.2' }}' | xargs)" >> $GITHUB_ENV
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_ENV
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> $GITHUB_ENV
        shell: bash

      # Simulators default to "Connect Hardware Keyboard" on, which suppresses the
      # on-screen keyboard — XCUITest's typing synthesis relies on it appearing to
      # establish keyboard focus, so text-field taps fail with "Neither element nor
      # any descendant has keyboard focus" without this. Must be set before boot.
      - name: Disable simulator hardware keyboard
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
        shell: bash

      - uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ inputs.simulator-name || 'iPhone 16' }}
          os: 'iOS'
          os_version: ${{ inputs.ios-version || '26.2' }}

      - name: Install CocoaPods dependencies
        working-directory: ios-app
        run: pod update Record360SDK
        shell: bash

      - name: Copy Configuration plist
        working-directory: ios-app
        run: sh ci_scripts/ci_configuration.sh
        shell: bash

      # xcpretty (unmaintained since ~2020) doesn't compact Xcode 26's build-system
      # trace output at all — the raw xcodebuild verbosity leaks straight through.
      # xcbeautify is the actively maintained replacement; ci_scripts/run-testsuite.sh
      # and run-tests.sh (ios-app repo) must be switched to pipe through it instead
      # of `bundle exec xcpretty` for this to take effect.
      - name: Install xcbeautify
        run: brew install xcbeautify
        shell: bash

      # -------------------- CLEAN --------------------
      - name: Clean previous test results
        working-directory: ios-app
        run: |
          rm -rf TestResult.xcresult allure-results allure-report
          mkdir -p allure-results
        shell: bash

      # -------------------- RUN TESTS --------------------
      - name: Start test timer
        run: echo "TEST_START_TIME=$(date +%s)" >> $GITHUB_ENV
        shell: bash

      - name: Execute Staging-UI
        if: "${{ inputs.list_tests == '' }}"
        working-directory: ios-app
        run: |
          chmod +x ./ci_scripts/run-testsuite.sh
          # Two-stage noise filter, both applied to the console only:
          #   1. TEST_LOG_NOISE_FILTER  — XCUITest accessibility-hierarchy dumps
          #   2. BUILD_LOG_NOISE_FILTER — Xcode 26 build-system verbosity
          # run-testsuite.sh also writes an unfiltered full-build.log for debugging.
          #
          # IMPORTANT: do NOT use `... || true` here. `|| true` runs `true` when
          # the pipeline fails, which OVERWRITES $PIPESTATUS with true's [0], so a
          # failing test run would report exit 0 and the step would stay green.
          # Instead disable -e only around the pipeline, capture the real
          # xcodebuild exit code from PIPESTATUS[0], then restore -e.
          set +e
          ./ci_scripts/run-testsuite.sh --testBundle="$TEST_BUNDLE" --path="$PATH_TEST_SUITE" --deviceName="${SIMULATOR_NAME}" \
            | grep -Ev "$TEST_LOG_NOISE_FILTER" \
            | grep -Ev "$BUILD_LOG_NOISE_FILTER"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "run-testsuite.sh exit code: $EXIT_CODE"
          exit $EXIT_CODE
        shell: bash

      - name: Execute custom test Staging-UI
        if: "${{ inputs.list_tests != '' }}"
        working-directory: ios-app
        run: |
          chmod +x ./ci_scripts/run-tests.sh
          # Same two-stage console noise filter as the main Execute step above.
          # See that step for why `|| true` must not be used (it would swallow the
          # real exit code and keep the step green on test failures).
          set +e
          ./ci_scripts/run-tests.sh --testBundle="$TEST_BUNDLE" --list-tests=${{ inputs.list_tests }} --deviceName="${SIMULATOR_NAME}" \
            | grep -Ev "$TEST_LOG_NOISE_FILTER" \
            | grep -Ev "$BUILD_LOG_NOISE_FILTER"
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          echo "run-tests.sh exit code: $EXIT_CODE"
          exit $EXIT_CODE
        shell: bash

      - name: Compute test duration
        if: success() || failure()
        run: |
          DURATION=$(( $(date +%s) - TEST_START_TIME ))
          DURATION_STR="${DURATION}s"
          if [ "$DURATION" -ge 60 ]; then
            DURATION_STR="$(( DURATION / 60 ))m $(( DURATION % 60 ))s"
          fi
          echo "TEST_DURATION=$DURATION_STR" >> $GITHUB_ENV
        shell: bash

      # -------------------- DEBUG: what actually happened --------------------
      # Prints the ground-truth markers from the unfiltered log so we can tell
      # whether the build succeeded, whether tests were even invoked, and where
      # it stopped. Remove this step once the pipeline is healthy again.
      - name: Diagnose build/test output
        if: always()
        working-directory: ios-app
        run: |
          echo "===== full-build.log info ====="
          if [ ! -f full-build.log ]; then
            echo "❌ full-build.log NOT FOUND — run-testsuite.sh did not run or did not tee. Check the script."
            exit 0
          fi
          ls -lh full-build.log
          echo
          echo "===== tests parsed by parse_test_names.py (was xcodebuild given any tests?) ====="
          # re-run the parser purely to show what it produced (does not affect the test run)
          python3 ./ci_scripts/parse_test_names.py "$PATH_TEST_SUITE" "$TEST_BUNDLE" || echo "(parser returned non-zero / empty)"
          echo
          echo "===== build result markers ====="
          grep -nE "error:|BUILD FAILED|BUILD SUCCEEDED|Testing failed|TEST FAILED|TEST SUCCEEDED|The test runner|Unable to find a destination|No such|Failed to|Lost connection" full-build.log | head -40 || echo "(none found)"
          echo
          echo "===== test invocation markers ====="
          echo "Test Suite lines: $(grep -c 'Test Suite' full-build.log)"
          echo "Test Case lines:  $(grep -c 'Test Case' full-build.log)"
          grep -nE "Test Suite '|Test Case '" full-build.log | head -20 || echo "(no test cases were invoked)"
          echo
          echo "===== last 60 lines of the log (where it stopped) ====="
          tail -60 full-build.log
        shell: bash

      # Full, unfiltered xcodebuild output. Temporarily set to always() while
      # debugging so you can inspect it even on a pass; switch back to
      # `if: failure()` once healthy.
      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-build-log
          path: ios-app/full-build.log
          retention-days: 7
          if-no-files-found: ignore

      # -------------------- VALIDATE & CONVERT xcresult --------------------
      - name: Validate xcresult
        if: success() || failure()
        working-directory: ios-app
        run: |
          if [ ! -d "TestResult.xcresult" ]; then
            echo "❌ TestResult.xcresult not found — tests may not have run"
            exit 1
          fi

          # `xcresulttool get` (default "object" subcommand) is deprecated on Xcode 16+
          # and now errors without --legacy — the old check silently swallowed that
          # error (2>/dev/null) and always reported "0 actions", even for a fully
          # populated xcresult. Use the current "test-results summary" API instead.
          SUMMARY_JSON=$(xcrun xcresulttool get test-results summary --path TestResult.xcresult --compact 2>&1)
          TOTAL_COUNT=$(echo "$SUMMARY_JSON" | jq '.totalTestCount' 2>/dev/null)
          if [ -z "$TOTAL_COUNT" ] || [ "$TOTAL_COUNT" = "null" ] || [ "$TOTAL_COUNT" = "0" ]; then
            echo "❌ xcresult has no recorded tests"
            echo "$SUMMARY_JSON"
            exit 1
          fi
          echo "✅ xcresult contains $TOTAL_COUNT test(s)"

          # Source the reporting counts from Apple's native summary (reliable on
          # Xcode 26), NOT from xcresults/allure-results which is currently broken
          # on the new .xcresult format. These SUITE_* values feed the Google Chat
          # card, so they must come from a source that actually works.
          PASSED=$(echo "$SUMMARY_JSON"  | jq '.passedTests  // 0')
          FAILED=$(echo "$SUMMARY_JSON"  | jq '.failedTests  // 0')
          SKIPPED=$(echo "$SUMMARY_JSON" | jq '.skippedTests // 0')
          TOTAL=$TOTAL_COUNT
          PASS_RATE=$(awk "BEGIN{ if ($TOTAL>0) printf \"%.1f\", $PASSED*100/$TOTAL; else print 0 }")
          {
            echo "SUITE_PASSED=$PASSED"
            echo "SUITE_FAILED=$FAILED"
            echo "SUITE_SKIPPED=$SKIPPED"
            echo "SUITE_TOTAL=$TOTAL"
            echo "SUITE_PASS_RATE=$PASS_RATE"
          } >> "$GITHUB_ENV"
          echo "Reporting counts → Passed=$PASSED Failed=$FAILED Skipped=$SKIPPED Total=$TOTAL PassRate=$PASS_RATE%"
        shell: bash

      # -------------------- TEMP DEBUG (remove once mapping is confirmed) ------
      # Dumps the raw failure-node structure that xcresulttool records for each
      # failed test, so we can see exactly what text/fields Apple stores and tune
      # the converter's failure-message selection. Runs only when tests failed.
      - name: DEBUG dump failure nodes
        if: failure()
        working-directory: ios-app
        run: |
          python3 - <<'PYEOF'
          import json, subprocess, sys

          def xc(*args):
              return subprocess.run(
                  ["xcrun", "xcresulttool", "get", "test-results", *args,
                   "--path", "TestResult.xcresult", "--compact"],
                  capture_output=True, text=True)

          tests = xc("tests")
          if tests.returncode != 0:
              sys.stderr.write(tests.stderr); sys.exit(0)
          data = json.loads(tests.stdout)

          cases = []
          def walk(n):
              lo = (n.get("nodeType") or "").strip().lower()
              if lo == "test case":
                  cases.append((n.get("nodeIdentifier") or n.get("name"), n.get("result")))
              for c in n.get("children", []) or []:
                  walk(c)
          for n in (data.get("testNodes") or []):
              walk(n)

          print("===== TEST CASES (id :: result) =====")
          for cid, res in cases:
              print(f"  {res}  ::  {cid}")

          failed = [c for c in cases if (c[1] or "").lower() == "failed"]
          target = failed[0][0] if failed else (cases[0][0] if cases else None)

          print(f"\n===== ACTIVITIES (raw schema) for: {target} =====")
          if target:
              act = xc("activities", "--test-id", target)
              if act.returncode == 0:
                  # pretty-print first ~7000 chars so we can read the field names
                  try:
                      print(json.dumps(json.loads(act.stdout), indent=2, ensure_ascii=False)[:7000])
                  except Exception:
                      print(act.stdout[:7000])
              else:
                  print("`activities` failed:", act.stderr[:400])
                  det = xc("test-details", "--test-id", target)
                  print("\n===== TEST-DETAILS fallback =====")
                  print(det.stdout[:7000] if det.returncode == 0 else det.stderr[:400])
          PYEOF
        shell: bash

      - name: Export xcresult to Allure results
        if: success() || failure()
        working-directory: ios-app
        env:
          XCRESULT_PATH: TestResult.xcresult
          ALLURE_OUT: allure-results
        run: |
          # xcresults 1.13.1 crashes (NullPointerException) on Xcode 26's new
          # .xcresult format. Instead we convert using Apple's current, supported
          # API (`xcrun xcresulttool get test-results tests`), inline here so no
          # extra file is committed. It produces the same Allure 2 *-result.json
          # files, so every downstream step (retry filter, categories, environment,
          # history, generate, Firebase, Google Chat) keeps working unchanged.
          mkdir -p "$ALLURE_OUT"
          export ANCHOR_EPOCH="${TEST_START_TIME:-$(date +%s)}"
          python3 - <<'PYEOF'
          import hashlib, json, os, re, subprocess, sys, time, uuid

          bundle = os.environ["XCRESULT_PATH"]
          out_dir = os.environ["ALLURE_OUT"]
          anchor = float(os.environ.get("ANCHOR_EPOCH") or time.time())

          def map_status(r):
              r = (r or "").strip().lower()
              if r in ("passed", "expected failure"): return "passed"
              if r == "skipped": return "skipped"
              if r == "failed": return "failed"
              return "broken"

          _DUR = re.compile(r"(?:(\d+)\s*m)?\s*(?:([\d.,]+)\s*s)?\s*(?:([\d.,]+)\s*ms)?", re.I)
          def dur_ms(d):
              if d is None: return 0
              if isinstance(d, (int, float)): return int(d * 1000)
              s = str(d).strip()
              if not s: return 0
              if re.fullmatch(r"[\d.,]+", s): return int(float(s.replace(",", ".")) * 1000)
              t = 0.0; m = _DUR.match(s)
              if m:
                  mm, ss, ms = m.groups()
                  if mm: t += float(mm) * 60000
                  if ss: t += float(ss.replace(",", ".")) * 1000
                  if ms: t += float(ms.replace(",", "."))
              return int(t)

          FAIL = {"failure message", "failure"}
          def fail_text(node):
              out = []
              def w(n):
                  if (n.get("nodeType") or "").strip().lower() in FAIL:
                      txt = n.get("name") or n.get("details") or ""
                      if txt: out.append(txt)
                  for c in n.get("children", []) or []: w(c)
              for c in node.get("children", []) or []: w(c)
              return "\n".join(out)

          def full_name(ident, name, suite):
              if ident:
                  x = ident.replace("()", "").split("(")[0].replace("/", ".")
                  return x
              b = name.replace("()", "").split("(")[0]
              return f"{suite}.{b}" if suite else b

          raw = subprocess.run(
              ["xcrun", "xcresulttool", "get", "test-results", "tests",
               "--path", bundle, "--compact"],
              capture_output=True, text=True)
          if raw.returncode != 0:
              sys.stderr.write("xcresulttool failed:\n" + raw.stderr + "\n"); sys.exit(2)
          data = json.loads(raw.stdout)
          os.makedirs(out_dir, exist_ok=True)

          cursor = [int(anchor * 1000)]
          written = [0]

          def emit(node, parent_suite, suite, bundle_name):
              name = (node.get("name") or "").replace("()", "").strip()
              ident = node.get("nodeIdentifier") or ""
              status = map_status(node.get("result"))
              d = node.get("durationInSeconds")
              d = int(float(d) * 1000) if d is not None else dur_ms(node.get("duration"))
              start = cursor[0]; stop = start + d; cursor[0] = stop + 1
              fn = full_name(ident, name, suite)
              res = {
                  "uuid": str(uuid.uuid4()),
                  "historyId": hashlib.md5(fn.encode("utf-8")).hexdigest(),
                  "name": name or fn, "fullName": fn, "status": status,
                  "stage": "finished", "start": start, "stop": stop,
                  "labels": [{"name": "framework", "value": "XCUITest"},
                             {"name": "language", "value": "swift"}],
              }
              # Flat layout: put every test case directly under the bundle
              # (e.g. record360UITests) in the Suites tab, NOT nested inside a
              # per-class sub-suite. So the top-level suite is the bundle name;
              # the class is kept only as a testClass label (does not nest).
              top = bundle_name or parent_suite or suite
              if top:
                  res["labels"].append({"name": "suite", "value": top})
              if suite and suite != top:
                  res["labels"].append({"name": "testClass", "value": suite})
              if bundle_name: res["labels"].append({"name": "package", "value": bundle_name})
              if status in ("failed", "broken"):
                  tr = fail_text(node)
                  msg = tr.splitlines()[0] if tr else "Test failed"
                  res["statusDetails"] = {"message": msg, "trace": tr or msg}
              with open(os.path.join(out_dir, res["uuid"] + "-result.json"), "w") as f:
                  json.dump(res, f, ensure_ascii=False, indent=2)
              written[0] += 1

          def walk(node, ps="", su="", bn=""):
              nt = (node.get("nodeType") or "").strip().lower()
              nm = node.get("name") or ""
              if nt in ("unit test bundle", "ui test bundle", "test bundle"):
                  bn = nm; ps = nm
              elif nt in ("test suite", "test suite group"):
                  su = nm
              elif nt == "test case":
                  emit(node, ps or bn, su or bn, bn); return
              for c in node.get("children", []) or []:
                  walk(c, ps, su, bn)

          for n in (data.get("testNodes") or data.get("children") or []):
              walk(n)
          print(f"Converted {written[0]} test result(s) into {out_dir}")
          PYEOF

          RESULT_COUNT=$(ls allure-results/*-result.json 2>/dev/null | wc -l | tr -d ' ')
          if [ "$RESULT_COUNT" = "0" ]; then
            echo "❌ Converter produced no Allure results"
            exit 1
          fi
          echo "✅ Converted $RESULT_COUNT result(s) via native xcresulttool"
        shell: bash

      # -------------------- FILTER RETRIES --------------------
      - name: Filter retry results
        if: success() || failure()
        working-directory: ios-app
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, glob
          from collections import defaultdict

          results_dir = "allure-results"
          files = glob.glob(f"{results_dir}/*-result.json")

          history_map = defaultdict(list)
          for f in files:
              try:
                  with open(f) as fp:
                      data = json.load(fp)
                  history_map[data.get("historyId", f)].append((data.get("start", 0), f, data))
              except Exception as e:
                  print(f"Error reading {f}: {e}")

          passed = failed = skipped = broken = removed = 0

          for hid, entries in history_map.items():
              entries.sort(key=lambda x: x[0], reverse=True)
              _, keep_file, keep_data = entries[0]
              status = keep_data.get("status", "")
              if status == "passed":
                  passed += 1
              elif status == "failed":
                  failed += 1
              elif status == "skipped":
                  skipped += 1
              elif status == "broken":
                  broken += 1

              for _, filepath, _ in entries[1:]:
                  os.remove(filepath)
                  print(f"Removed retry: {os.path.basename(filepath)}")
                  removed += 1

          total = passed + failed + skipped + broken
          # broken (crashed/errored) counts as a failure for reporting purposes
          failed_total = failed + broken
          pass_rate = round(passed * 100 / total, 1) if total > 0 else 0

          print(f"Passed={passed} Failed={failed_total} Skipped={skipped} Total={total} RemovedRetries={removed}")

          # NOTE: SUITE_* counts are now set from the native xcresulttool summary
          # in the "Verify xcresult" step, which is reliable on Xcode 26. This step
          # only dedups retry files for a clean Allure report; it must NOT write the
          # counts anymore. Previously it did, and whenever the xcresults export
          # failed there were no *-result.json files, so it reported 0 for
          # everything and sent wrong numbers to Google Chat.
          PYEOF

      # -------------------- ALLURE HISTORY (trend) --------------------
      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ secrets.WDIO_IOS_REPOS }}
          token: ${{ secrets.WDIO_ACCESS_TOKEN }}
          ref: allure-history
          path: report-history

      - name: Copy previous Allure history (for trend graphs)
        if: always()
        run: |
          mkdir -p ios-app/allure-results/history
          cp -r report-history/last-history/. ios-app/allure-results/history 2>/dev/null || true
        shell: bash

      # -------------------- ALLURE METADATA --------------------
      - name: Create Allure categories
        if: always()
        working-directory: ios-app
        run: |
          cat > allure-results/categories.json << 'EOF'
          [
            { "name": "Product Bugs", "matchedStatuses": ["failed"], "traceRegex": ".*XCTAssert.*" },
            { "name": "Test Bugs",    "matchedStatuses": ["broken"] },
            { "name": "Skipped",      "matchedStatuses": ["skipped"] }
          ]
          EOF
        shell: bash

      - name: Create Allure environment.properties
        if: always()
        working-directory: ios-app
        run: |
          cat > allure-results/environment.properties << EOF
          Platform=iOS
          OS.Version=${IOS_VERSION}
          Device=${SIMULATOR_NAME}
          Xcode.Version=${XCODE_VERSION}
          macOS.Version=${MACOS_VERSION}
          Test.Bundle=${TEST_BUNDLE}
          Build.Time=$(date '+%Y-%m-%d %H:%M:%S')
          EOF
        shell: bash

      - name: Create Allure executor.json
        if: always()
        working-directory: ios-app
        run: |
          cat > allure-results/executor.json << EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }},
            "buildUrl": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "iOS UI Tests - Run #${{ github.run_number }}"
          }
          EOF
        shell: bash

      # -------------------- GENERATE REPORT --------------------
      - name: Generate Allure Report
        if: always()
        working-directory: ios-app
        run: npx --yes allure-commandline@2.37.0 generate allure-results --clean -o allure-report
        shell: bash

      - name: Trim trend history
        if: always()
        working-directory: ios-app
        run: |
          for trend_file in allure-report/history/*-trend.json; do
            [ -f "$trend_file" ] || continue
            trimmed=$(jq 'if length > 10 then .[-10:] else . end' "$trend_file" 2>/dev/null)
            [ -n "$trimmed" ] && echo "$trimmed" > "$trend_file"
          done
        shell: bash

      - name: Save history for next run
        if: always()
        run: |
          mkdir -p allure-history-branch
          cp -r ios-app/allure-report/history allure-history-branch/last-history
        shell: bash

      - name: Push report history to branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WDIO_ACCESS_TOKEN }}
          external_repository: ${{ secrets.WDIO_IOS_REPOS }}
          publish_branch: allure-history
          publish_dir: allure-history-branch

      # -------------------- ARTIFACTS --------------------
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: ios-app/allure-report/
          retention-days: 7

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: ios-app/allure-results/
          retention-days: 7

      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResult-xcresult
          path: ios-app/TestResult.xcresult
          retention-days: 7

      # ============================================================
      # ALLURE 3 TRIAL (side-by-side comparison, safe to keep or delete)
      # These steps generate a SECOND report using Allure 3, which reads the
      # .xcresult directly (native test body: steps, sub-steps, attachments).
      # They are continue-on-error and never touch the Allure 2 pipeline, the
      # Firebase deploy, or the Google Chat counts (which come from the native
      # xcresulttool summary). Compare the "allure3-trial-report" artifact with
      # the normal report, then decide whether to migrate. Delete this whole
      # block if you stay on Allure 2.
      # ============================================================
      - name: "Allure 3 trial — generate report"
        if: always()
        continue-on-error: true
        working-directory: ios-app
        run: |
          echo "Node: $(node --version 2>/dev/null || echo 'not found')"
          # Allure 3 ships on npm as the 'allure' package. Try a global install,
          # fall back to npx. Allure 3 reads the xcresult bundle directly and
          # requires a full Xcode install (present on this runner).
          npm install -g allure >/dev/null 2>&1 || true
          GEN() { allure "$@" 2>/dev/null || npx --yes allure "$@"; }
          allure --version 2>/dev/null || npx --yes allure --version || true
          echo "Generating Allure 3 report from TestResult.xcresult ..."
          GEN generate TestResult.xcresult --clean --output allure3-report \
            || GEN generate TestResult.xcresult -o allure3-report \
            || echo "⚠️ Allure 3 generate failed — check the command/flags for this Allure 3 version above."
          echo "---- allure3-report contents ----"
          ls -la allure3-report 2>/dev/null || echo "(no report produced)"
        shell: bash

      - name: "Allure 3 trial — upload report"
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure3-trial-report
          path: ios-app/allure3-report
          retention-days: 7
          if-no-files-found: ignore

      # -------------------- DEPLOY REPORT --------------------
      # See .github/workflows/smoke-test-manual.yml for the web equivalent
      # (Firebase project "record360-report").
      - name: Prepare deploy folder
        if: always()
        run: |
          mkdir -p deploy
          cp -r ios-app/allure-report/* deploy/

      - name: Create firebase config
        if: always()
        run: |
          echo '{
            "hosting": {
              "public": "deploy",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "limit": 3
            }
          }' > firebase.json

          echo '{
            "projects": {
              "default": "${{ env.IOS_FIREBASE_PROJECT_ID }}"
            }
          }' > .firebaserc

      - name: Set up Firebase credentials
        if: always()
        run: echo '${{ secrets.IOS_FIREBASE_SERVICE_ACCOUNT }}' > $GITHUB_WORKSPACE/service-account.json

      # w9jds/firebase-action is a Docker container action — container actions only
      # run on Linux runners, and this job runs on macOS (required for Xcode). Use
      # the Firebase CLI directly via npx instead; it's a plain Node CLI and works
      # the same way on macOS. GOOGLE_APPLICATION_CREDENTIALS auth works identically.
      - name: Deploy Allure Report to Firebase Hosting
        if: always()
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$IOS_FIREBASE_PROJECT_ID"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        shell: bash

      # -------------------- NOTIFY GOOGLE CHAT --------------------
      - name: Notify Google Chat
        if: always()
        run: |
          STATUS="PASSED"; STATUS_COLOR="#0F9D58"; STATUS_ICON="✅"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS="FAILED"; STATUS_COLOR="#DB4437"; STATUS_ICON="❌"
          fi

          export STATUS STATUS_COLOR STATUS_ICON
          export DATE_TIME="$(date '+%d/%m/%Y %H:%M:%S')"
          export REPORT_URL="https://${{ env.IOS_FIREBASE_PROJECT_ID }}.web.app"
          export RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export PASSED="${SUITE_PASSED:-0}"
          export FAILED="${SUITE_FAILED:-0}"
          export SKIPPED="${SUITE_SKIPPED:-0}"
          export TOTAL="${SUITE_TOTAL:-0}"
          export PASS_RATE="${SUITE_PASS_RATE:-0}"
          export DURATION="${TEST_DURATION:-N/A}"
          export DEVICE="${SIMULATOR_NAME} · iOS ${IOS_VERSION}"
          export BRANCH="${{ github.event.inputs.testing-branch || 'master' }}"

          # macOS runners don't ship envsubst (gettext) by default, so substitute with python3 instead.
          python3 - <<'PYEOF'
          import os
          from string import Template

          with open(".github/googleChat/ios-report-card.json") as f:
              tpl = Template(f.read())

          keys = ["STATUS_ICON", "DATE_TIME", "REPORT_URL", "RUN_URL", "PASSED", "PASS_RATE",
                  "FAILED", "SKIPPED", "TOTAL", "DURATION", "DEVICE", "BRANCH", "STATUS_COLOR", "STATUS"]
          payload = tpl.safe_substitute({k: os.environ.get(k, "") for k in keys})

          with open("payload.json", "w") as f:
              f.write(payload)
          PYEOF

          curl -X POST "${{ secrets.TEST_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @payload.json
        shell: bash