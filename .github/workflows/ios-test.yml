name: iOS UI Test
run-name: ${{ github.actor }} is XCUITests
on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: 'Input name of runner'
        required: true
        default: 'macos-latest'
        type: string
      list_tests:
        description: Input subset of tests for testing
        required: false
      ios-version:
        description: 'iOS Version (e.g., 26.2)'
        required: false
        default: '26.2'
        type: string
      simulator-name:
        description: 'Simulator Name'
        required: false
        default: 'iPhone 17'
        type: string
      xcode-version:
        description: 'Xcode version'
        required: false
        default: '26.2'
        type: string
      testing-branch:
        description: 'testing branch(e.g., master)'
        required: false
        type: string
      shard_count:
        description: 'Number of parallel shards for the full suite (ignored when list_tests is set)'
        required: false
        default: '2'
        type: string

env:
  PATH_TEST_SUITE: record360UITests/Resources/testRun.json
  TEST_BUNDLE: record360UITests
  IOS_FIREBASE_PROJECT_ID: ${{ secrets.IOS_FIREBASE_PROJECT_ID }}

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  # -------------------- TIMER --------------------
  start:
    name: Start timer
    runs-on: ubuntu-latest
    outputs:
      start_time: ${{ steps.t.outputs.start_time }}
    steps:
      - id: t
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

  # -------------------- PLAN SHARDS --------------------
  plan:
    name: Plan test shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.split.outputs.shards }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{secrets.WDIO_ACCESS_TOKEN}}
          repository: ${{secrets.WDIO_IOS_REPOS}}
          ref: ${{ github.event.inputs.testing-branch || 'master' }}
          sparse-checkout: |
            record360UITests/Resources/testRun.json
          sparse-checkout-cone-mode: false

      - id: split
        env:
          SHARD_COUNT: ${{ inputs.shard_count || '6' }}
          TEST_RUN_JSON: ${{ env.PATH_TEST_SUITE }}
          LIST_TESTS: ${{ inputs.list_tests }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          list_tests = os.environ.get("LIST_TESTS", "").strip()
          if list_tests:
              names = [t for t in re.split(r"[,\s]+", list_tests) if t]
              print(f"Using {len(names)} test(s) from list_tests input")
          else:
              with open(os.environ["TEST_RUN_JSON"]) as f:
                  data = json.load(f)
              names = []
              for feature in data["testsuite"]:
                  if feature.get("enabled"):
                      for tc in feature.get("testCases", []):
                          if tc.get("enabled"):
                              names.append(tc["name"])
              print(f"Using {len(names)} enabled test(s) from testRun.json")

          n = max(1, int(os.environ["SHARD_COUNT"]))
          n = min(n, len(names)) if names else n
          shards = [[] for _ in range(n)]
          for i, name in enumerate(names):
              shards[i % n].append(name)
          shards = [s for s in shards if s]  # fewer tests than shards requested

          matrix = [
              {"index": i + 1, "tests": ",".join(s), "count": len(s)}
              for i, s in enumerate(shards)
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write("shards=" + json.dumps(matrix) + "\n")

          print(f"Planned {len(matrix)} shard(s) covering {len(names)} test(s) total")
          for m in matrix:
              print(f"  shard {m['index']}: {m['count']} test(s)")
          PY
        shell: bash

  # -------------------- SHARDED TEST EXECUTION --------------------
  test:
    name: "Test shard ${{ matrix.shard.index }}"
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    runs-on: ${{ github.event.inputs.runner_type || 'macos-latest' }}
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{secrets.WDIO_ACCESS_TOKEN}}
          repository: ${{secrets.WDIO_IOS_REPOS}}
          ref: ${{ github.event.inputs.testing-branch || 'master' }}

      - name: Set up SSH Agent and Key
        uses: tanmancan/action-setup-ssh-agent-key@1.0.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}
          ssh-public-key: ${{ secrets.PUBLIC_KEY_CHECKOUT }}

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '26.2' }}

      - name: Set simulator environment
        run: |
          echo "SIMULATOR_NAME=$(echo '${{ inputs.simulator-name || 'iPhone 17' }}' | xargs)" >> $GITHUB_ENV
          echo "IOS_VERSION=$(echo '${{ inputs.ios-version || '26.2' }}' | xargs)" >> $GITHUB_ENV
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_ENV
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> $GITHUB_ENV
        shell: bash

      - name: Disable simulator hardware keyboard
        run: defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
        shell: bash

      - uses: futureware-tech/simulator-action@v4
        with:
          model: ${{ inputs.simulator-name || 'iPhone 17' }}
          os: 'iOS'
          os_version: ${{ inputs.ios-version || '26.2' }}

      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: |
          # customers.pspdfkit.com (PSPDFKit's binary CDN) occasionally resets the
          # connection mid-download from GitHub-hosted runners — retry instead of
          # failing the whole shard on a transient blip.
          for attempt in 1 2 3; do
            if pod install --repo-update && pod update Record360SDK; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "❌ pod install/update failed after $attempt attempts"
              exit 1
            fi
            echo "⚠️ pod install/update failed (attempt $attempt/3) — retrying in 20s..."
            sleep 20
          done
        shell: bash

      - name: Copy Configuration plist
        run: sh ci_scripts/ci_configuration.sh
        shell: bash

      - name: Install xcpretty from https://github.com/xcpretty
        run: |
          echo "source 'https://rubygems.org'" > Gemfile
          echo "gem 'xcpretty', git: 'https://github.com/xcpretty/xcpretty.git', branch: 'master'" >> Gemfile
          bundle install
          bundle exec xcpretty --version

      - name: Run shard tests
        run: |
          chmod +x ./ci_scripts/run-tests.sh
          ./ci_scripts/run-tests.sh --testBundle="$TEST_BUNDLE" --list-tests="${{ matrix.shard.tests }}" --deviceName="${SIMULATOR_NAME}"
        shell: bash

      - name: Package result bundle for upload
        if: always()
        run: |
          if [ -d TestResult.xcresult ]; then
            echo "✅ TestResult.xcresult exists"
          else
            echo "❌ TestResult.xcresult does not exist in $(pwd) — xcodebuild likely didn't get far enough to write one"
            ls -la
            exit 0
          fi
          mkdir -p shard-payload
          mv TestResult.xcresult "shard-payload/TestResult-shard-${{ matrix.shard.index }}.xcresult"
          ls -la shard-payload
        shell: bash

      - name: Upload shard xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-shard-${{ matrix.shard.index }}
          path: shard-payload
          retention-days: 7
          if-no-files-found: warn

  # -------------------- REPORT & NOTIFY --------------------
  report:
    name: Report & Notify
    needs: [start, plan, test]
    if: always()
    runs-on: ${{ github.event.inputs.runner_type || 'macos-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{secrets.WDIO_ACCESS_TOKEN}}
          repository: ${{secrets.WDIO_IOS_REPOS}}
          ref: ${{ github.event.inputs.testing-branch || 'master' }}

      # Only needed for the Google Chat card template below. Kept in a
      # subfolder (not root) so it can't collide with the ios-app checkout
      # above or change how any other step resolves paths.
      - name: Checkout workflow repo (for Google Chat template)
        uses: actions/checkout@v4
        with:
          path: .workflow-repo

      # Same Xcode version as whatever generated the shard xcresults — a
      # newer/older xcresulttool than the one that produced the bundle can
      # fail to read it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode-version || '26.2' }}

      - name: Set report metadata
        if: always()
        run: |
          echo "SIMULATOR_NAME=$(echo '${{ inputs.simulator-name || 'iPhone 17' }}' | xargs)" >> $GITHUB_ENV
          echo "IOS_VERSION=$(echo '${{ inputs.ios-version || '26.2' }}' | xargs)" >> $GITHUB_ENV
          echo "XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')" >> $GITHUB_ENV
          echo "MACOS_VERSION=$(sw_vers -productVersion)" >> $GITHUB_ENV
        shell: bash

      - name: Compute test duration
        if: always()
        run: |
          START=${{ needs.start.outputs.start_time }}
          NOW=$(date +%s)
          DURATION=$(( NOW - START ))
          DURATION_STR="${DURATION}s"
          if [ "$DURATION" -ge 60 ]; then
            DURATION_STR="$(( DURATION / 60 ))m $(( DURATION % 60 ))s"
          fi
          echo "TEST_DURATION=$DURATION_STR" >> $GITHUB_ENV
        shell: bash

      - name: Download all shard results
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: xcresult-*
          path: results
          merge-multiple: true

      # -------------------- MERGE xcresult BUNDLES --------------------
      - name: Merge xcresult bundles
        if: always()
        run: |
          shopt -s nullglob
          bundles=(results/*.xcresult)
          if [ "${#bundles[@]}" -eq 0 ]; then
            echo "❌ No xcresult bundles downloaded from any shard/job — nothing to merge"
          elif [ "${#bundles[@]}" -eq 1 ]; then
            echo "Only one bundle — copying as-is: ${bundles[0]}"
            cp -r "${bundles[0]}" TestResult.xcresult
          else
            echo "Merging ${#bundles[@]} xcresult bundle(s): ${bundles[*]}"
            xcrun xcresulttool merge "${bundles[@]}" --output-path TestResult.xcresult \
              || xcrun xcresulttool merge --legacy "${bundles[@]}" --output-path TestResult.xcresult
          fi
        shell: bash

      # -------------------- VALIDATE & CONVERT xcresult --------------------
      - name: Validate xcresult
        if: always()
        run: |
          if [ ! -d "TestResult.xcresult" ]; then
            echo "❌ TestResult.xcresult not found — no shard produced a usable result"
            exit 1
          fi

          # `xcresulttool get` (default "object" subcommand) is deprecated on Xcode 16+
          # and now errors without --legacy — use the current "test-results summary" API.
          SUMMARY_JSON=$(xcrun xcresulttool get test-results summary --path TestResult.xcresult --compact 2>&1)
          TOTAL_COUNT=$(echo "$SUMMARY_JSON" | jq '.totalTestCount' 2>/dev/null)
          if [ -z "$TOTAL_COUNT" ] || [ "$TOTAL_COUNT" = "null" ] || [ "$TOTAL_COUNT" = "0" ]; then
            echo "❌ xcresult has no recorded tests"
            echo "$SUMMARY_JSON"
            exit 1
          fi
          echo "✅ xcresult contains $TOTAL_COUNT test(s)"

          PASSED=$(echo "$SUMMARY_JSON"  | jq '.passedTests  // 0')
          FAILED=$(echo "$SUMMARY_JSON"  | jq '.failedTests  // 0')
          SKIPPED=$(echo "$SUMMARY_JSON" | jq '.skippedTests // 0')
          TOTAL=$TOTAL_COUNT
          PASS_RATE=$(awk "BEGIN{ if ($TOTAL>0) printf \"%.1f\", $PASSED*100/$TOTAL; else print 0 }")
          {
            echo "SUITE_PASSED=$PASSED"
            echo "SUITE_FAILED=$FAILED"
            echo "SUITE_SKIPPED=$SKIPPED"
            echo "SUITE_TOTAL=$TOTAL"
            echo "SUITE_PASS_RATE=$PASS_RATE"
          } >> "$GITHUB_ENV"
          echo "Reporting counts → Passed=$PASSED Failed=$FAILED Skipped=$SKIPPED Total=$TOTAL PassRate=$PASS_RATE%"
        shell: bash

      # -------------------- EXPORT FAILED TEST CASES TO GOOGLE SHEETS --------------------
      # Same sheet layout/formatting as smoke-test-manual.yml's WDIO export
      # (feature header rows, checkbox + Type/Status dropdowns, colored
      # chips) — adapted source: WDIO parses a spec-reporter log, iOS instead
      # reads the merged .xcresult directly and maps each failed test class
      # back to its testRun.json feature grouping.
      - name: Export Failed Test Cases to Google Sheets
        if: always() && env.SUITE_FAILED != '' && env.SUITE_FAILED != '0'
        run: |
          # Use `python3 -m pip` (not bare `pip`) so the install target is
          # guaranteed to be the exact same interpreter that runs the script
          # below — a bare `pip` can resolve to a different Python on a
          # runner with multiple installs, leaving the right python3 unable
          # to see the just-installed packages ("No module named 'google'").
          python3 -m pip install --quiet google-auth google-auth-httplib2 google-api-python-client

          python3 << 'PYEOF'
          import datetime
          import json
          import os
          import subprocess
          from collections import OrderedDict

          from google.oauth2 import service_account
          from googleapiclient.discovery import build

          # ── Config ────────────────────────────────────────────────────────────
          SA_JSON       = os.environ["GSHEET_SERVICE_ACCOUNT"]
          SPREADSHEET   = os.environ["GSHEET_SPREADSHEET_ID"]
          XCRESULT      = "TestResult.xcresult"
          TEST_RUN_JSON = os.environ["TEST_RUN_JSON"]
          SCOPES        = ["https://www.googleapis.com/auth/spreadsheets"]

          # ── Build test-class → feature map from testRun.json ─────────────────
          with open(TEST_RUN_JSON) as f:
              suite = json.load(f)
          feature_of = {}
          for feature in suite["testsuite"]:
              for tc in feature.get("testCases", []):
                  feature_of[tc["name"]] = feature["name"]

          # ── Pull failed test-class names out of the merged xcresult ──────────
          # `xcresulttool get test-results tests` (Xcode 16+) returns a nested
          # test-node tree; exact depth varies (plan → bundle → class → case),
          # so this only assumes "leaf node with a failing result" + "its
          # immediate parent's name is the class" rather than a fixed depth.
          proc = subprocess.run(
              ["xcrun", "xcresulttool", "get", "test-results", "tests",
               "--path", XCRESULT, "--compact"],
              capture_output=True, text=True,
          )
          failed_classes = set()
          try:
              data = json.loads(proc.stdout)

              def walk(node, parent_name):
                  children = node.get("children") or []
                  status = str(node.get("result", "")).lower()
                  if not children and "fail" in status and parent_name:
                      failed_classes.add(parent_name)
                  for child in children:
                      walk(child, node.get("name", parent_name))

              for root in data.get("testNodes", []):
                  walk(root, None)
          except Exception as e:
              print(f"⚠️ Could not parse xcresulttool test-results output: {e}")
              print(proc.stdout[:2000])

          if not failed_classes:
              print("No failed test classes resolved from xcresult — skipping Google Sheets export.")
              raise SystemExit(0)

          feature_map = OrderedDict()
          for cls in sorted(failed_classes):
              feat = feature_of.get(cls, "Unknown")
              feature_map.setdefault(feat, []).append(cls)

          total_failed = sum(len(v) for v in feature_map.values())
          print(f"Found {total_failed} failed test class(es) across {len(feature_map)} feature(s):")
          for feat, tcs in feature_map.items():
              print(f"  [{feat}]")
              for tc in tcs:
                  print(f"    • {tc}")

          # ── Auth ──────────────────────────────────────────────────────────────
          creds   = service_account.Credentials.from_service_account_info(
                        json.loads(SA_JSON), scopes=SCOPES)
          service = build("sheets", "v4", credentials=creds)
          sheets  = service.spreadsheets()

          # ── Resolve target sheet name (MM/DD or MM/DD-2, MM/DD-3 …) ──────────
          tz        = datetime.timezone(datetime.timedelta(hours=7))
          today     = datetime.datetime.now(tz)
          base_name = today.strftime("%m/%d")

          meta     = sheets.get(spreadsheetId=SPREADSHEET).execute()
          existing = {s["properties"]["title"] for s in meta["sheets"]}

          sheet_name = base_name
          idx = 2
          while sheet_name in existing:
              sheet_name = f"{base_name}-{idx}"
              idx += 1

          # ── Build row data ────────────────────────────────────────────────────
          # Columns: A=TCs | B=Run | C=Type | D=Status | E=Note | F-Z=empty
          TOTAL_COLS = 26
          EMPTY      = [""] * (TOTAL_COLS - 5)

          header_row          = ["TCs", "Run", "Type", "Status", "Note"] + EMPTY
          all_rows            = [header_row]
          feature_row_indices = []
          tc_row_indices      = []

          for feat_name, tcs in feature_map.items():
              feature_row_indices.append(len(all_rows))
              all_rows.append([feat_name] + [""] * (TOTAL_COLS - 1))
              for tc in tcs:
                  tc_row_indices.append(len(all_rows))
                  # B=True (boolean) → renders as a checked checkbox after validation applied
                  all_rows.append([tc, True, "Existing", "Fail", ""] + EMPTY)

          total_rows = len(all_rows)

          # ── Create the new sheet ──────────────────────────────────────────────
          resp = sheets.batchUpdate(
              spreadsheetId=SPREADSHEET,
              body={"requests": [{"addSheet": {"properties": {
                  "title": sheet_name,
                  "index": 0,
                  "gridProperties": {
                      "rowCount": max(200, total_rows + 10),
                      "columnCount": TOTAL_COLS,
                  },
              }}}]},
          ).execute()
          new_sheet_id = resp["replies"][0]["addSheet"]["properties"]["sheetId"]
          print(f"Created sheet: '{sheet_name}' (id={new_sheet_id})")

          def cr(r1, c1, r2, c2):
              return {"sheetId": new_sheet_id,
                      "startRowIndex": r1, "endRowIndex": r2,
                      "startColumnIndex": c1, "endColumnIndex": c2}

          DARK_BG   = {"red": 0.2,   "green": 0.2,   "blue": 0.2}
          YELLOW_BG = {"red": 1.0,   "green": 0.949, "blue": 0.0}
          RED_BG    = {"red": 0.863, "green": 0.196, "blue": 0.184}
          GREEN_BG  = {"red": 0.118, "green": 0.588, "blue": 0.235}
          GRAY_BG   = {"red": 0.851, "green": 0.851, "blue": 0.851}
          WHITE     = {"red": 1.0,   "green": 1.0,   "blue": 1.0}
          BLACK     = {"red": 0.0,   "green": 0.0,   "blue": 0.0}

          # ── STEP 1 — cell formatting ──────────────────────────────────────────
          fmt_requests = [{
              "repeatCell": {
                  "range": cr(0, 0, 1, TOTAL_COLS),
                  "cell": {"userEnteredFormat": {
                      "backgroundColor": DARK_BG,
                      "textFormat": {"bold": True, "foregroundColor": WHITE, "fontSize": 10},
                      "horizontalAlignment": "CENTER",
                      "verticalAlignment": "MIDDLE",
                  }},
                  "fields": "userEnteredFormat(backgroundColor,textFormat,horizontalAlignment,verticalAlignment)",
              }
          }]

          for r in feature_row_indices:
              fmt_requests.append({
                  "repeatCell": {
                      "range": cr(r, 0, r + 1, TOTAL_COLS),
                      "cell": {"userEnteredFormat": {
                          "backgroundColor": YELLOW_BG,
                          "textFormat": {"bold": True, "foregroundColor": BLACK, "fontSize": 10},
                          "horizontalAlignment": "LEFT",
                          "verticalAlignment": "MIDDLE",
                      }},
                      "fields": "userEnteredFormat(backgroundColor,textFormat,horizontalAlignment,verticalAlignment)",
                  }
              })

          if tc_row_indices:
              first_tc = tc_row_indices[0]
              last_tc  = tc_row_indices[-1] + 1
              for col in (1, 2, 3):  # Run, Type, Status
                  fmt_requests.append({
                      "repeatCell": {
                          "range": cr(first_tc, col, last_tc, col + 1),
                          "cell": {"userEnteredFormat": {
                              "horizontalAlignment": "CENTER",
                              "verticalAlignment": "MIDDLE",
                          }},
                          "fields": "userEnteredFormat(horizontalAlignment,verticalAlignment)",
                      }
                  })

          sheets.batchUpdate(spreadsheetId=SPREADSHEET, body={"requests": fmt_requests}).execute()
          print("✅ Cell formatting applied.")

          # ── STEP 2 — data validation (checkbox + dropdowns) ───────────────────
          if tc_row_indices:
              val_requests = [
                  {"setDataValidation": {"range": cr(first_tc, 1, last_tc, 2), "rule": {
                      "condition": {"type": "BOOLEAN"}, "showCustomUi": True, "strict": True}}},
                  {"setDataValidation": {"range": cr(first_tc, 2, last_tc, 3), "rule": {
                      "condition": {"type": "ONE_OF_LIST", "values": [
                          {"userEnteredValue": "Existing"}, {"userEnteredValue": "New Feature"}]},
                      "showCustomUi": True, "strict": True}}},
                  {"setDataValidation": {"range": cr(first_tc, 3, last_tc, 4), "rule": {
                      "condition": {"type": "ONE_OF_LIST", "values": [
                          {"userEnteredValue": "Fail"}, {"userEnteredValue": "Pass"}]},
                      "showCustomUi": True, "strict": True}}},
              ]
              sheets.batchUpdate(spreadsheetId=SPREADSHEET, body={"requests": val_requests}).execute()
              print("✅ Data validation applied.")

          # ── STEP 3 — conditional formatting (chip colors) ─────────────────────
          if tc_row_indices:
              cond_requests = [
                  {"addConditionalFormatRule": {"index": 0, "rule": {
                      "ranges": [cr(first_tc, 2, last_tc, 3)],
                      "booleanRule": {
                          "condition": {"type": "TEXT_EQ", "values": [{"userEnteredValue": "Existing"}]},
                          "format": {"backgroundColor": GRAY_BG, "textFormat": {"bold": True, "foregroundColor": BLACK}},
                      }}}},
                  {"addConditionalFormatRule": {"index": 1, "rule": {
                      "ranges": [cr(first_tc, 2, last_tc, 3)],
                      "booleanRule": {
                          "condition": {"type": "TEXT_EQ", "values": [{"userEnteredValue": "New Feature"}]},
                          "format": {"backgroundColor": {"red": 0.643, "green": 0.761, "blue": 0.957},
                                     "textFormat": {"bold": True, "foregroundColor": BLACK}},
                      }}}},
                  {"addConditionalFormatRule": {"index": 2, "rule": {
                      "ranges": [cr(first_tc, 3, last_tc, 4)],
                      "booleanRule": {
                          "condition": {"type": "TEXT_EQ", "values": [{"userEnteredValue": "Fail"}]},
                          "format": {"backgroundColor": RED_BG, "textFormat": {"bold": True, "foregroundColor": WHITE}},
                      }}}},
                  {"addConditionalFormatRule": {"index": 3, "rule": {
                      "ranges": [cr(first_tc, 3, last_tc, 4)],
                      "booleanRule": {
                          "condition": {"type": "TEXT_EQ", "values": [{"userEnteredValue": "Pass"}]},
                          "format": {"backgroundColor": GREEN_BG, "textFormat": {"bold": True, "foregroundColor": WHITE}},
                      }}}},
              ]
              sheets.batchUpdate(spreadsheetId=SPREADSHEET, body={"requests": cond_requests}).execute()
              print("✅ Conditional formatting applied.")

          # ── STEP 4 — write data (after validation, so True renders checked) ───
          sheets.values().update(
              spreadsheetId=SPREADSHEET,
              range=f"'{sheet_name}'!A1",
              valueInputOption="RAW",
              body={"values": all_rows},
          ).execute()
          print("✅ Data written.")

          # ── STEP 5 — auto-resize A-E + freeze header row ──────────────────────
          sheets.batchUpdate(spreadsheetId=SPREADSHEET, body={"requests": [
              {"autoResizeDimensions": {"dimensions": {
                  "sheetId": new_sheet_id, "dimension": "COLUMNS", "startIndex": 0, "endIndex": 5}}},
              {"updateSheetProperties": {
                  "properties": {"sheetId": new_sheet_id, "gridProperties": {"frozenRowCount": 1}},
                  "fields": "gridProperties.frozenRowCount"}},
          ]}).execute()
          print("✅ Auto-resize and freeze applied.")

          print(f"\n🎉 Exported {total_failed} failed test class(es) to sheet '{sheet_name}'.")
          PYEOF
        env:
          GSHEET_SERVICE_ACCOUNT: ${{ secrets.IOS_GSHEET_SERVICE_ACCOUNT }}
          GSHEET_SPREADSHEET_ID: ${{ secrets.IOS_GSHEET_SPREADSHEET_ID }}
          TEST_RUN_JSON: ${{ env.PATH_TEST_SUITE }}
        shell: bash

      # -------------------- ALLURE 3 HISTORY (trend persistence) --------------------
      - name: Get Allure history
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ${{ secrets.WDIO_IOS_REPOS }}
          token: ${{ secrets.WDIO_ACCESS_TOKEN }}
          ref: allure-history
          path: report-history

      - name: Restore Allure history file
        if: always()
        run: |
          # Bring the previous run's history.jsonl in so the new report continues
          # the trend. First run (empty branch) just starts fresh.
          cp report-history/history.jsonl history.jsonl 2>/dev/null \
            || echo "No previous history.jsonl (first run?) — starting fresh."
        shell: bash

      # -------------------- GENERATE ALLURE 3 REPORT --------------------
      - name: Generate Allure 3 report
        if: always()
        run: |
          # Must be a LOCAL install, not -g: allurerc.mjs does `import { defineConfig }
          # from "allure"`, and Node's ESM resolver never looks in the global npm
          # directory for plain `import` specifiers (unlike CJS require+NODE_PATH).
          npm install allure --no-save >/dev/null 2>&1 || true
          # Full-featured Allure 3 config. Everything that used to be separate
          # files/steps in Allure 2 (categories.json, environment.properties,
          # trend trimming) now lives here. Executor/CI info is auto-detected.
          cat > allurerc.mjs <<'JS'
          import { defineConfig } from "allure";

          const v = (k) => process.env[k] || "";

          export default defineConfig({
            name: "Record360 iOS UI Tests",
            output: "./allure-report",
            historyPath: "./history.jsonl",
            appendHistory: true,
            historyLimit: 10, // keep last 10 runs in the trend (replaces Trim step)
            variables: {
              "Platform": "iOS",
              "OS Version": v("IOS_VERSION"),
              "Device": v("SIMULATOR_NAME"),
              "Xcode Version": v("XCODE_VERSION"),
              "macOS Version": v("MACOS_VERSION"),
              "Test Bundle": v("TEST_BUNDLE"),
            },
            categories: {
              rules: [
                { name: "Product Bugs", matchers: { statuses: ["failed"], trace: /XCTAssert/ } },
                { name: "Test Bugs",    matchers: { statuses: ["broken"] } },
                { name: "Skipped",      matchers: { statuses: ["skipped"] } },
              ],
            },
            plugins: {
              awesome: {
                options: {
                  reportName: "Record360 iOS UI Tests",
                  singleFile: false,
                  reportLanguage: "en",
                },
              },
              dashboard: {
                options: {
                  reportName: "Record360 iOS — Dashboard",
                  reportLanguage: "en",
                },
              },
            },
          });
          JS
          allure --version 2>/dev/null || npx --yes allure --version || true
          echo "Generating Allure 3 report from TestResult.xcresult ..."
          allure generate TestResult.xcresult 2>/dev/null \
            || npx --yes allure generate TestResult.xcresult
          echo "---- generated report tree ----"
          find allure-report -maxdepth 2 -name index.html || true
        shell: bash

      - name: Save Allure history for next run
        if: always()
        run: |
          mkdir -p allure-history-branch
          # Allure 3 appended this run to history.jsonl during generate.
          cp history.jsonl allure-history-branch/history.jsonl 2>/dev/null \
            || echo "No history.jsonl produced — skipping save."
        shell: bash

      - name: Push report history to branch
        if: always()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.WDIO_ACCESS_TOKEN }}
          external_repository: ${{ secrets.WDIO_IOS_REPOS }}
          publish_branch: allure-history
          publish_dir: allure-history-branch

      # -------------------- ARTIFACTS --------------------
      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 7

      - name: Prepare deploy folder
        if: always()
        run: |
          mkdir -p deploy
          # Allure 3 nests each plugin's report in its own subdir. Serve the
          # awesome report at the site root, and the charts dashboard at /dashboard.
          #
          # Guard every branch on the source actually existing: this step runs
          # `if: always()`, so a failure upstream (or an empty allure-report/)
          # must not hard-fail this step too.
          if [ -f allure-report/awesome/index.html ]; then
            cp -r allure-report/awesome/. deploy/
          elif [ -d allure-report ] && [ -n "$(ls -A allure-report 2>/dev/null)" ]; then
            cp -r allure-report/. deploy/   # fallback: whatever was produced
          else
            echo "⚠️ No allure-report was generated — deploying a placeholder page instead."
            echo "<html><body><h1>No Allure report was generated for this run.</h1></body></html>" > deploy/index.html
          fi
          if [ -d allure-report/dashboard ]; then
            mkdir -p deploy/dashboard
            cp -r allure-report/dashboard/. deploy/dashboard/
          fi

      - name: Create firebase config
        if: always()
        run: |
          echo '{
            "hosting": {
              "public": "deploy",
              "ignore": ["firebase.json", "**/.*", "**/node_modules/**"],
              "limit": 3
            }
          }' > firebase.json

          echo '{
            "projects": {
              "default": "${{ env.IOS_FIREBASE_PROJECT_ID }}"
            }
          }' > .firebaserc

      - name: Set up Firebase credentials
        if: always()
        run: echo '${{ secrets.IOS_FIREBASE_SERVICE_ACCOUNT }}' > $GITHUB_WORKSPACE/service-account.json

      - name: Deploy Allure Report to Firebase Hosting
        if: always()
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$IOS_FIREBASE_PROJECT_ID"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        shell: bash

      # -------------------- NOTIFY GOOGLE CHAT --------------------
      - name: Notify Google Chat
        if: always()
        run: |
          # job.status here is `report`'s own status. A shard failing/getting
          # cancelled doesn't fail `report` itself (needs: [...] + if: always()),
          # so real PASSED/FAILED signal comes from the SUITE_* counts set by
          # Validate xcresult above, not from job.status. job.status only goes
          # non-success if something in THIS job (merge/report machinery) broke.
          if [ -n "${SUITE_TOTAL:-}" ] && [ "${SUITE_TOTAL:-0}" != "0" ]; then
            if [ "${SUITE_FAILED:-0}" = "0" ]; then
              STATUS="PASSED"; STATUS_COLOR="#0F9D58"; STATUS_ICON="✅"
            else
              STATUS="FAILED"; STATUS_COLOR="#DB4437"; STATUS_ICON="❌"
            fi
          else
            # No usable xcresult at all (every shard cancelled/crashed before
            # producing one) — distinct from "ran and failed".
            STATUS="CANCELLED"; STATUS_COLOR="#F4B400"; STATUS_ICON="⚠️"
          fi

          export STATUS STATUS_COLOR STATUS_ICON
          export DATE_TIME="$(date '+%d/%m/%Y %H:%M:%S')"
          export REPORT_URL="https://${{ env.IOS_FIREBASE_PROJECT_ID }}.web.app"
          export RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          export PASSED="${SUITE_PASSED:-0}"
          export FAILED="${SUITE_FAILED:-0}"
          export SKIPPED="${SUITE_SKIPPED:-0}"
          export TOTAL="${SUITE_TOTAL:-0}"
          export PASS_RATE="${SUITE_PASS_RATE:-0}"
          export DURATION="${TEST_DURATION:-N/A}"
          export DEVICE="${SIMULATOR_NAME} · iOS ${IOS_VERSION}"
          export BRANCH="${{ github.event.inputs.testing-branch || 'master' }}"

          # macOS runners don't ship envsubst (gettext) by default, so substitute with python3 instead.
          python3 - <<'PYEOF'
          import os
          from string import Template

          with open(".workflow-repo/.github/googleChat/ios-report-card.json") as f:
              tpl = Template(f.read())

          keys = ["STATUS_ICON", "DATE_TIME", "REPORT_URL", "RUN_URL", "PASSED", "PASS_RATE",
                  "FAILED", "SKIPPED", "TOTAL", "DURATION", "DEVICE", "BRANCH", "STATUS_COLOR", "STATUS"]
          payload = tpl.safe_substitute({k: os.environ.get(k, "") for k in keys})

          with open("payload.json", "w") as f:
              f.write(payload)
          PYEOF

          curl -X POST "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d @payload.json
        shell: bash

      # Same directory-flattening quirk as the shard uploads (see "Package
      # result bundle for upload" in the test job): upload-artifact drops the
      # leaf directory's own name, so uploading TestResult.xcresult directly
      # would give downloaders a pile of loose files instead of a bundle they
      # can double-click/xcrun against. Wrap it first.
      - name: Package merged result bundle for upload
        if: always()
        run: |
          mkdir -p final-payload
          cp -r TestResult.xcresult final-payload/ 2>/dev/null \
            || echo "⚠️ No merged TestResult.xcresult to package."
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: UI Test Result
          path: final-payload
          retention-days: 7
          if-no-files-found: warn
